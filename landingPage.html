<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eket Storage - IKEA Style">
  <title>Eket Storage - Customization</title>
  <link rel="stylesheet" href="styles.css">
</head>
<style>/* Resetting margin and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: black;
      font-family:Arial, Helvetica, sans-serif ;
    }
    
    /* Body & layout */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    
    .container {
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }
    
    header {
      background-color: #f5f5f5;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    header .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    header .logo {
      height: 40px;
    }
    
    nav ul {
      display: flex;
      list-style: none;
    }
    
    nav ul li {
      margin-left: 20px;
    }
    
    nav ul li a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    #startBox {
      display: flex;
      flex-direction: column;
    }
    h1, h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }
    
    button.color-option {
      margin-right: 10px;
    }
    
    .product-options {
      width: 50%;
    }
    
    .product-image {
      width: 100%;
      padding: 5px;
    }
    
    .color-options, .size-options {
      margin-top: 20px;
    }
    
    .add-to-cart-btn {
      background-color: #ff9800;
      color: white;
      margin-top: 20px;
    }
    
    .cart-summary {
      width: 45%;
      background-color: #fff;
      
      border-radius: 2px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    footer {
      text-align: center;
     
     
      color: white;
      margin-top: 10px;
    }
    .ikea-button {
  background-color: #006f87;  /* IKEA Blue */
  color: white;
  font-family: 'Helvetica Neue', Arial, sans-serif; /* IKEA's font style */
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  padding: 12px 24px;
  border: 2px solid #006f87;
  border-radius: 25px;  /* Rounded edges */
  text-align: center;
  text-decoration: none;
  display: inline-block;
  cursor: pointer;
  transition: all 0.3s ease;
}

    </style>
    <script>// Color Selection
        const colorButtons = document.querySelectorAll('.color-option');
        colorButtons.forEach(button => {
          button.addEventListener('click', function() {
            colorButtons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
          });
        });
        
        // Add to Cart Button Functionality
        const addToCartButton = document.getElementById('add-to-cart');
        const cartInfo = document.getElementById('cart-info');
        
        addToCartButton.addEventListener('click', function() {
          const selectedColor = document.querySelector('.color-option.selected');
          const size = document.getElementById('size').value;
        
          if (selectedColor) {
            const color = selectedColor.textContent;
            cartInfo.textContent = `You have added a ${size} ${color} storage unit to your cart.`;
          } else {
            cartInfo.textContent = "Please select a color before adding to cart.";
          }
        });
        </script>
<body>
  <!-- Header Section -->
  <header>
    <div class="header-container">
        <a href="https://www.ikea.com"><img src="ikeaLogo.png" alt="IKEA Logo" class="logo"></a>
     
    </div>
  </header>

  <!-- Main Section -->
  <main>
    <div class="container">
      <!-- Product Image & Options Section -->
      <section class="product-options">
       
        <img src="ikea1.png" alt="Eket Storage Unit" class="product-image">
        
        <div id="startBox">
        <h2>Enter Code:</h2>
   <input id="inputMain" > <a id="quagmireStart" href="start2.html"><button class='ikea-button'>Play as Quagmire</button></a>
   <a id="julesStart" href="start3.html" ><button class="ikea-button">Play as Jools Lebron</button></a>
    </div>
        
        

       
      </section>
      
      <!-- Cart Summary Section -->
      <section class="cart-summary">
    <a href="index copy.html"><img src="ikea3.png" alt="Eket Storage Unit" class="product-image"></a>
        
      </section>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <div class="footer-container">
        <img src="bottom.png" alt="Eket Storage Unit" class="product-image">
     
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
